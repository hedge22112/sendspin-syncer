[project]
name = "sendspin-syncer"
version = "0.1.0"
description = "Measure the playback delay of Sendspin players with a microphone"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiosendspin[server]>=9.1,<10",
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "rich>=13",
    "zeroconf>=0.147",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
sendspin-syncer = "sendspin_syncer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sendspin_syncer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
